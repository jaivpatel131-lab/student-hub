<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>StudentHub | Register</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body class="auth-page register-page"><div class="auth-wrap"><div class="auth-visual"><a class="brand text-white" href="index.html"><span class="brand-mark"><i class="fa-solid fa-graduation-cap"></i></span> StudentHub</a><div class="auth-visual-content"><span class="eyebrow light">GET STARTED</span><h1>Build your<br><span>student profile.</span></h1><p>Create a demo account and experience the complete StudentHub workflow.</p><div class="auth-points"><span><i class="fa-solid fa-user-plus"></i> Quick registration</span><span><i class="fa-solid fa-lock"></i> Front-end demo only</span></div></div></div>
<div class="auth-form-side"><div class="auth-form wide"><div class="mobile-brand"><a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-graduation-cap"></i></span> StudentHub</a></div><span class="eyebrow">NEW STUDENT</span><h2>Create your account</h2><p class="muted">Fill in your details to set up your demo profile.</p>
<form id="registerForm" novalidate><div class="row g-3"><div class="col-md-6 form-group"><label>Full Name</label><input id="regName" class="form-control" required placeholder="Your full name"></div><div class="col-md-6 form-group"><label>Student ID</label><input id="regId" class="form-control" required placeholder="STU-2026-001"></div><div class="col-md-6 form-group"><label>Email</label><input id="regEmail" class="form-control" type="email" required placeholder="you@example.com"></div><div class="col-md-6 form-group"><label>Phone</label><input id="regPhone" class="form-control" required placeholder="+91 98765 43210"></div><div class="col-md-6 form-group"><label>Date of Birth</label><input id="regDob" class="form-control" type="date" required></div><div class="col-md-3 form-group"><label>Gender</label><select id="regGender" class="form-select" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="col-md-3 form-group"><label>Semester</label><select id="regSemester" class="form-select" required><option value="">Select</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div><div class="col-md-6 form-group"><label>Course</label><select id="regCourse" class="form-select" required><option value="">Select course</option><option>Computer Science & Engineering</option><option>Information Technology</option><option>Computer Engineering</option><option>Electronics & Communication</option></select></div><div class="col-md-6 form-group"><label>Password</label><div class="input-icon"><input id="regPassword" class="form-control" type="password" required placeholder="Minimum 8 characters"><button type="button" class="password-toggle" data-target="regPassword"><i class="fa-regular fa-eye"></i></button></div><div class="strength mt-2"><span></span><span></span><span></span><span></span></div></div><div class="col-md-6 form-group"><label>Confirm Password</label><input id="regConfirm" class="form-control" type="password" required placeholder="Re-enter password"></div><div class="col-12 form-group"><label>Address</label><textarea id="regAddress" class="form-control" rows="2" required placeholder="Your address"></textarea></div></div>
<div class="form-check my-3"><input id="terms" class="form-check-input" type="checkbox" required><label class="form-check-label" for="terms">I agree to the demo <a href="#">terms & conditions</a>.</label></div><button class="btn btn-primary btn-lg w-100 rounded-3" type="submit">Create Account <i class="fa-solid fa-arrow-right ms-2"></i></button></form><p class="auth-bottom">Already registered? <a href="login.html">Sign in</a></p></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/main.js"></script><script src="js/auth.js"></script></body></html>
